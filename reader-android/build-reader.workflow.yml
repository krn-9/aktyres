# Builds the Payment Reader app in GitHub's cloud (nothing is installed on anyone's computer) and
# publishes the finished file at: Releases -> "Payment Reader (latest)" -> payment-reader.apk
#
# To switch it on, add THIS file to the repository as  .github/workflows/build-reader.yml
# (GitHub website: Add file -> Create new file -> paste this -> Commit).
name: Build Payment Reader
on:
  workflow_dispatch:
  push:
    paths:
      - 'reader-android/**'
      - '.github/workflows/build-reader.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the app
        working-directory: reader-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: payment-reader-apk
          path: reader-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the app file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp reader-android/app/build/outputs/apk/debug/app-debug.apk payment-reader.apk
          gh release view reader-latest >/dev/null 2>&1 || gh release create reader-latest --title "Payment Reader (latest)" --notes "Install payment-reader.apk on the counter phone."
          gh release upload reader-latest payment-reader.apk --clobber
