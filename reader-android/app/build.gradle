plugins {
    id 'com.android.application'
}

// No libraries on purpose: the app only uses what Android itself provides, so there is nothing
// third-party inside it to trust or keep updated.
android {
    namespace 'com.aktyres.reader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aktyres.reader'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
